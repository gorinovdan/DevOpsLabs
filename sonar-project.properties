sonar.projectKey=flowboard
sonar.projectName=FlowBoard
sonar.projectVersion=1.0

# Production source roots.
sonar.sources=backend,frontend/src

# Test source roots.
sonar.tests=backend,frontend/tests

# Test classification - everything matching these patterns is a test, not a source.
sonar.test.inclusions=backend/**/*_test.go,backend/tests/**/*.go,frontend/tests/**/*.{ts,tsx},frontend/src/shared/test/**

# Files we never want analysed at all (vendored, generated, build output).
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,**/vendor/**

sonar.sourceEncoding=UTF-8

# Coverage report locations.
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.go.tests.reportPaths=backend/test-report.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Suppress code smells that fire mostly in test fixtures (duplicate string
# literals, cognitive complexity of table-driven tests). They aren't bugs;
# they aren't worth refactoring at the cost of test readability.
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,t5
sonar.issue.ignore.multicriteria.t1.ruleKey=*:S1192
sonar.issue.ignore.multicriteria.t1.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.t2.ruleKey=*:S3776
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.t3.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.t3.resourceKey=frontend/src/shared/test/**
sonar.issue.ignore.multicriteria.t4.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.t4.resourceKey=backend/internal/service/logic.go
sonar.issue.ignore.multicriteria.t5.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.t5.resourceKey=frontend/src/app/App.tsx

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
