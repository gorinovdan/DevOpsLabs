apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: flowboard
  source:
    repoURL: https://github.com/gorinovdan/DevOpsLabs.git
    targetRevision: main
    path: deploy/argocd/app
  destination:
    server: https://kubernetes.default.svc
    namespace: flowboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # Argo CD's spec-equality comparator otherwise reports Deployment/Service as
  # OutOfSync forever because HPA owns Deployment replicas and the apiserver
  # dehydrates the manifest with these default fields on apply, which the
  # rendered manifest doesn't carry.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
        - /spec/progressDeadlineSeconds
        - /spec/revisionHistoryLimit
        - /spec/strategy
        - /status/terminatingReplicas
    - group: apps
      kind: ReplicaSet
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/revisionHistoryLimit
        - /status/terminatingReplicas
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /spec/ipFamilies
        - /spec/ipFamilyPolicy
        - /spec/internalTrafficPolicy
        - /spec/sessionAffinity
