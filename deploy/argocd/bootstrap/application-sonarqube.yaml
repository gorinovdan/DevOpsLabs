apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: flowboard
  source:
    repoURL: https://github.com/gorinovdan/DevOpsLabs.git
    targetRevision: main
    path: deploy/argocd/sonarqube
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # apiserver fills these in for any Deployment/StatefulSet that omits them.
    # Without ignoring them, Argo CD reports OutOfSync forever even though
    # `kubectl apply` is a no-op.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/progressDeadlineSeconds
        - /spec/revisionHistoryLimit
        - /spec/strategy
        - /status/terminatingReplicas
    - group: apps
      kind: ReplicaSet
      jsonPointers:
        - /status/terminatingReplicas
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /spec/ipFamilies
        - /spec/ipFamilyPolicy
        - /spec/internalTrafficPolicy
        - /spec/sessionAffinity
