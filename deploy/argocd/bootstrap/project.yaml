apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: flowboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: FlowBoard application project (LAB4)
  sourceRepos:
    - "*"
  destinations:
    - namespace: flowboard
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
