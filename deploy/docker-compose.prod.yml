services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-flowboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowboard}
      POSTGRES_DB: ${DB_NAME:-flowboard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flowboard} -d ${DB_NAME:-flowboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_DSN: host=postgres user=${DB_USER:-flowboard} password=${DB_PASSWORD:-flowboard} dbname=${DB_NAME:-flowboard} port=5432 sslmode=disable TimeZone=UTC
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
