---
- name: Deploy FlowBoard to Minikube
  hosts: app
  become: "{{ (ansible_user | default('root')) != 'root' }}"
  gather_facts: false

  vars:
    local_k8s_dir: "{{ playbook_dir }}/../../../deploy/k8s"
    remote_k8s_dir: "{{ deploy_dir }}/k8s"

  pre_tasks:
    - name: Bootstrap Python 3 when missing
      ansible.builtin.raw: |
        set -eu
        if command -v python3 >/dev/null 2>&1; then
          echo "python-present"
        else
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3
          echo "python-installed"
        fi
      register: python_bootstrap
      changed_when: "'python-installed' in python_bootstrap.stdout"

    - name: Gather facts
      ansible.builtin.setup:

  tasks:
    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Upload Kubernetes manifests
      ansible.builtin.copy:
        src: "{{ local_k8s_dir }}/"
        dest: "{{ remote_k8s_dir }}/"
        mode: "0644"

    - name: Login to Docker registry when credentials are provided
      ansible.builtin.shell: |
        set -eu
        echo "{{ registry_password }}" | docker login "{{ registry_url }}" --username "{{ registry_username }}" --password-stdin
      when:
        - registry_url | length > 0
        - registry_username | length > 0
        - registry_password | length > 0
      no_log: true

    - name: Apply namespace and core services
      ansible.builtin.command: "kubectl apply -f {{ item }}"
      loop:
        - "{{ remote_k8s_dir }}/namespace.yaml"
        - "{{ remote_k8s_dir }}/postgres.yaml"
        - "{{ remote_k8s_dir }}/backend-deployment.yaml"
        - "{{ remote_k8s_dir }}/frontend-deployment.yaml"
        - "{{ remote_k8s_dir }}/backend-hpa.yaml"
        - "{{ remote_k8s_dir }}/fkubectl logs -n flowboard
          postgres-68b6f7cbfc-5ntnjrontend-hpa.yaml"

    - name: Set backend image
      ansible.builtin.command: "kubectl -n flowboard set image deployment/backend
        backend={{ backend_image }}"

    - name: Set frontend image
      ansible.builtin.command: "kubectl -n flowboard set image deployment/frontend
        frontend={{ frontend_image }}"

    - name: Wait for postgres rollout
      ansible.builtin.command: kubectl -n flowboard rollout status deployment/postgres --timeout=300s
      changed_when: false

    - name: Wait for backend rollout
      ansible.builtin.command: kubectl -n flowboard rollout status deployment/backend --timeout=300s
      changed_when: false

    - name: Wait for frontend rollout
      ansible.builtin.command: kubectl -n flowboard rollout status deployment/frontend --timeout=300s
      changed_when: false

    - name: Show Kubernetes resources
      ansible.builtin.command: kubectl -n flowboard get pods,svc,hpa
      changed_when: false
      register: k8s_status

    - name: Print Kubernetes resources
      ansible.builtin.debug:
        var: k8s_status.stdout_lines

    - name: Smoke test through frontend service URL on VM
      ansible.builtin.shell: |
        set -euo pipefail
        frontend_url="$(minikube service frontend -n flowboard --url | head -n 1)"
        curl -fsS -m 20 "${frontend_url}/api/insights" >/dev/null
        curl -fsS -m 20 "${frontend_url}/api/tasks" >/dev/null
      args:
        executable: /bin/bash
      changed_when: false
