name: CI/CD

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      run_hpa_validation:
        description: "Run backend HPA load validation after deploy"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "20"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - 'scripts/**'
            ci:
              - '.github/workflows/**'

  backend-build:
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN_BACKEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_BACKEND == 'true'

      - name: Backend build skipped
        if: env.RUN_BACKEND != 'true'
        run: echo "No backend or CI changes detected, skipping backend build."

      - uses: actions/setup-go@v5
        if: env.RUN_BACKEND == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend
        if: env.RUN_BACKEND == 'true'
        working-directory: backend
        run: go build ./...

  backend-test:
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN_BACKEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_BACKEND == 'true'

      - name: Backend tests skipped
        if: env.RUN_BACKEND != 'true'
        run: echo "No backend or CI changes detected, skipping backend tests."

      - uses: actions/setup-go@v5
        if: env.RUN_BACKEND == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Test backend
        if: env.RUN_BACKEND == 'true'
        working-directory: backend
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload backend coverage
        if: env.RUN_BACKEND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend-build:
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN_FRONTEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_FRONTEND == 'true'

      - name: Frontend build skipped
        if: env.RUN_FRONTEND != 'true'
        run: echo "No frontend or CI changes detected, skipping frontend build."

      - uses: actions/setup-node@v4
        if: env.RUN_FRONTEND == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend node_modules cache
        if: env.RUN_FRONTEND == 'true'
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        if: env.RUN_FRONTEND == 'true' && steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Build frontend
        if: env.RUN_FRONTEND == 'true'
        working-directory: frontend
        run: npm run build

  frontend-test:
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN_FRONTEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_FRONTEND == 'true'

      - name: Frontend tests skipped
        if: env.RUN_FRONTEND != 'true'
        run: echo "No frontend or CI changes detected, skipping frontend tests."

      - uses: actions/setup-node@v4
        if: env.RUN_FRONTEND == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend node_modules cache
        if: env.RUN_FRONTEND == 'true'
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        if: env.RUN_FRONTEND == 'true' && steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Test frontend
        if: env.RUN_FRONTEND == 'true'
        working-directory: frontend
        run: npm test

      - name: Upload frontend coverage
        if: env.RUN_FRONTEND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker-publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [changes, backend-build, backend-test, frontend-build, frontend-test]
    permissions:
      contents: read
      packages: write
    env:
      RUN_BACKEND_IMAGE: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
      RUN_FRONTEND_IMAGE: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image_sha }}
      frontend_image: ${{ steps.meta.outputs.frontend_image_sha }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_BACKEND_IMAGE == 'true' || env.RUN_FRONTEND_IMAGE == 'true'

      - name: Compute image names
        id: meta
        run: |
          set -euo pipefail
          repo_lc="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "repo_lc=${repo_lc}"
            echo "backend_image=ghcr.io/${repo_lc}/backend:latest"
            echo "frontend_image=ghcr.io/${repo_lc}/frontend:latest"
            echo "backend_image_sha=ghcr.io/${repo_lc}/backend:${GITHUB_SHA}"
            echo "frontend_image_sha=ghcr.io/${repo_lc}/frontend:${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker image build skipped
        if: env.RUN_BACKEND_IMAGE != 'true' && env.RUN_FRONTEND_IMAGE != 'true'
        run: echo "No backend/frontend or CI changes detected, skipping Docker image rebuild."

      - name: Login to GHCR
        if: env.RUN_BACKEND_IMAGE == 'true' || env.RUN_FRONTEND_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.RUN_BACKEND_IMAGE == 'true' || env.RUN_FRONTEND_IMAGE == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        if: env.RUN_BACKEND_IMAGE == 'true' || env.RUN_FRONTEND_IMAGE == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Build and push backend image
        if: env.RUN_BACKEND_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.backend_image_sha }}
            ${{ steps.meta.outputs.backend_image }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Build and push frontend image
        if: env.RUN_FRONTEND_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.frontend_image_sha }}
            ${{ steps.meta.outputs.frontend_image }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

  deploy-minikube:
    runs-on: [self-hosted, macOS, minikube-local]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true')
    needs: [changes, docker-publish]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: local-minikube-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ensure required tools on runner
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          for cmd in docker kubectl minikube curl tar python3 bash; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "Required command not found on self-hosted runner: $cmd" >&2
              exit 1
            fi
          done

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USER}" --password-stdin

      - name: Deploy to local Minikube
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.docker-publish.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.docker-publish.outputs.frontend_image }}
          AUTO_START_MINIKUBE: "1"
          BUILD_LOCAL: "0"
          BUILD_OBSERVABILITY_LOCAL: "1"
          ENABLE_OBSERVABILITY: "1"
          ENABLE_PORT_FORWARD: "0"
          RUN_SMOKE_TEST: "1"
        run: |
          set -euo pipefail
          if [[ -z "${BACKEND_IMAGE}" || -z "${FRONTEND_IMAGE}" ]]; then
            echo "Image outputs are empty. Check docker-publish job outputs." >&2
            exit 1
          fi
          ./scripts/deploy_minikube.sh

      - name: Verify idempotent redeploy
        shell: bash
        env:
          BACKEND_IMAGE: ${{ needs.docker-publish.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.docker-publish.outputs.frontend_image }}
          AUTO_START_MINIKUBE: "1"
          BUILD_LOCAL: "0"
          BUILD_OBSERVABILITY_LOCAL: "1"
          ENABLE_OBSERVABILITY: "1"
          ENABLE_PORT_FORWARD: "0"
          RUN_SMOKE_TEST: "1"
        run: |
          set -euo pipefail
          if [[ -z "${BACKEND_IMAGE}" || -z "${FRONTEND_IMAGE}" ]]; then
            echo "Image outputs are empty. Check docker-publish job outputs." >&2
            exit 1
          fi
          ./scripts/deploy_minikube.sh

      - name: Verify observability stack
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/verify_observability_minikube.sh

      - name: Validate backend HPA scaling
        if: github.event_name != 'workflow_dispatch' || inputs.run_hpa_validation
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/load_test_backend_hpa.sh

      - name: Print deployed resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n flowboard get pods,svc,hpa
          echo "---"
          kubectl -n monitoring get pods,svc
