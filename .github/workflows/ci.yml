name: CI/CD

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      run_hpa_validation:
        description: "Run backend HPA load validation after deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - 'scripts/**'
            ci:
              - '.github/workflows/**'

  local-cicd:
    runs-on: [self-hosted, macOS, minikube-local]
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: local-minikube-deploy
      cancel-in-progress: false
    env:
      RUN_BACKEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
      RUN_FRONTEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
      RUN_DEPLOY: ${{ github.event_name != 'pull_request' }}
      RUN_PUBLISH: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true') }}
      RUN_OBSERVABILITY_VERIFY: ${{ github.event_name != 'pull_request' }}
      RUN_HPA_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hpa_validation }}
      ENABLE_PORT_FORWARD: "1"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure required scripts are executable
        shell: bash
        run: chmod +x scripts/*.sh

      - name: Login to GHCR
        if: env.RUN_DEPLOY == 'true' || env.RUN_PUBLISH == 'true'
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USER}" --password-stdin

      - name: Run local CI/CD pipeline
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/run_local_cicd.sh
