name: CI/CD

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      run_hpa_validation:
        description: "Run backend HPA load validation after deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - 'scripts/**'
            ci:
              - '.github/workflows/**'

  notify-start:
    runs-on: ubuntu-latest
    needs: changes
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Notify Telegram - pipeline started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          chmod +x scripts/notify_telegram.sh
          ./scripts/notify_telegram.sh "pipeline" "started"

  backend-test:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Compile
        run: go build ./...

      - name: Install gotestsum (for SonarQube test report)
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Test with race detector and full coverage
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/gotestsum" \
            --jsonfile test-report.json \
            --format pkgname-and-test-fails \
            -- -race -count=1 -covermode=atomic \
                -coverpkg=./... \
                -coverprofile=coverage.out ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/test-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Notify Telegram - backend-test
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          chmod +x scripts/notify_telegram.sh
          ./scripts/notify_telegram.sh "backend-test" "${JOB_STATUS}" \
            "Go tests + race detector + cross-package coverage"

  frontend-test:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test with coverage (lcov)
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Notify Telegram - frontend-test
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          chmod +x scripts/notify_telegram.sh
          ./scripts/notify_telegram.sh "frontend-test" "${JOB_STATUS}" \
            "Vitest + lcov coverage + production bundle"

  sonar-scan:
    runs-on: [self-hosted, macOS, minikube-local]
    needs: [changes, backend-test, frontend-test]
    if: >-
      !cancelled() &&
      needs.backend-test.result == 'success' &&
      needs.frontend-test.result == 'success'
    concurrency:
      group: local-sonar-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Verify coverage artefacts
        run: |
          test -s backend/coverage.out
          test -s backend/test-report.json
          test -s frontend/coverage/lcov.info

      - name: Ensure minikube is running
        run: |
          source scripts/lib_minikube.sh
          ensure_minikube_running "1" "docker" "4" "6144"

      - name: Pre-load SonarQube images into minikube
        run: |
          source scripts/lib_minikube.sh
          load_image_into_minikube "sonarqube:26.4.0.121862-community"
          load_image_into_minikube "postgres:16-alpine"
          load_image_into_minikube "busybox:1.36"

      - name: Deploy SonarQube to minikube
        run: |
          kubectl apply -k deploy/argocd/sonarqube/
          kubectl -n sonarqube rollout status deploy/sonar-postgres --timeout=300s
          # Cold start of SonarQube + embedded ES + first DB schema migration
          # routinely takes 3-5 minutes on a 4-core minikube.
          kubectl -n sonarqube rollout status deploy/sonarqube --timeout=600s

      - name: Port-forward SonarQube and wait for status=UP
        env:
          SONARQUBE_URL: "http://127.0.0.1:19000"
          SONARQUBE_READY_TIMEOUT: "300"
        run: |
          source scripts/lib_minikube.sh
          # Resilient probe loop: kubectl port-forward periodically loses
          # the SPDY tunnel when the sonarqube pod restarts (minikube
          # docker hiccups). Detect a dead listener / broken tunnel and
          # respawn the port-forward inside the loop instead of giving up.
          ensure_port_forward "sonarqube" "sonarqube" "sonarqube" "19000" "9000"
          deadline=$(( $(date +%s) + SONARQUBE_READY_TIMEOUT ))
          fail_streak=0
          while [[ $(date +%s) -lt ${deadline} ]]; do
            if curl -fsS --max-time 2 "${SONARQUBE_URL}/api/system/status" 2>/dev/null | grep -q '"status":"UP"'; then
              echo "SonarQube is UP at ${SONARQUBE_URL}"
              exit 0
            fi
            fail_streak=$((fail_streak + 1))
            # 5 failed probes (~5-10s of dead tunnel) → respawn port-forward.
            if (( fail_streak >= 5 )); then
              echo "Probe stuck; respawning port-forward..."
              stop_port_forward "sonarqube" "sonarqube" "sonarqube" 19000 9000 || true
              ensure_port_forward "sonarqube" "sonarqube" "sonarqube" "19000" "9000" || true
              fail_streak=0
            fi
            sleep 1
          done
          echo "Error: SonarQube did not become UP within ${SONARQUBE_READY_TIMEOUT}s." >&2
          kubectl -n sonarqube logs deploy/sonarqube --tail=80 || true
          exit 1

      - name: Configure FlowBoard quality gate (>= 80% coverage, no issues)
        env:
          SONARQUBE_URL: "http://127.0.0.1:19000"
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONARQUBE_ADMIN_USER: ${{ secrets.SONARQUBE_ADMIN_USER || 'admin' }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD || 'admin' }}
          PROJECT_KEY: flowboard
        run: ./scripts/sonar_quality_gate.sh

      - name: Run sonar-scanner (waits for quality gate)
        env:
          SONARQUBE_URL: "http://127.0.0.1:19000"
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONARQUBE_ADMIN_USER: ${{ secrets.SONARQUBE_ADMIN_USER || 'admin' }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD || 'admin' }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/run_sonar_scan.sh

      - name: Notify Telegram - sonar-scan
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          ./scripts/notify_telegram.sh "sonar-scan" "${JOB_STATUS}" \
            "Quality Gate enforced (coverage >= 80%, zero bugs/vulns)."

  backend-image:
    runs-on: [self-hosted, macOS, minikube-local]
    needs: [changes, backend-test, sonar-scan]
    if: >-
      !cancelled() &&
      needs.sonar-scan.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.ci == 'true')
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.build.outputs.sha_tag }}
      latest_tag: ${{ steps.build.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USER}" --password-stdin

      - name: Build and tag backend image
        id: build
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          source scripts/lib_minikube.sh
          repo_lc="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          sha_tag="ghcr.io/${repo_lc}/backend:${GITHUB_SHA}"
          latest_tag="ghcr.io/${repo_lc}/backend:latest"

          build_backend_runtime_image_with_host_tools "${PWD}" "${sha_tag}"
          docker tag "${sha_tag}" "${latest_tag}"

          if [[ "${PUBLISH}" == "true" ]]; then
            echo "Publishing backend image to GHCR..."
            docker push "${sha_tag}"
            docker push "${latest_tag}"
          else
            echo "Skipping push (pull_request event)."
          fi

          {
            echo "sha_tag=${sha_tag}"
            echo "latest_tag=${latest_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Notify Telegram - backend-image
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ steps.build.outputs.sha_tag }}
        run: |
          ./scripts/notify_telegram.sh "backend-image" "${JOB_STATUS}" "${IMAGE_TAG}"

  frontend-image:
    runs-on: [self-hosted, macOS, minikube-local]
    needs: [changes, frontend-test, sonar-scan]
    if: >-
      !cancelled() &&
      needs.sonar-scan.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.ci == 'true')
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.build.outputs.sha_tag }}
      latest_tag: ${{ steps.build.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USER}" --password-stdin

      - name: Build and tag frontend image
        id: build
        env:
          PUBLISH: ${{ github.event_name != 'pull_request' }}
          FRONTEND_NGINX_IMAGE: "nginx:1.25-alpine"
        run: |
          set -euo pipefail
          source scripts/lib_minikube.sh
          repo_lc="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          sha_tag="ghcr.io/${repo_lc}/frontend:${GITHUB_SHA}"
          latest_tag="ghcr.io/${repo_lc}/frontend:latest"

          build_frontend_runtime_image_with_host_tools "${PWD}" "${sha_tag}" "${FRONTEND_NGINX_IMAGE}"
          docker tag "${sha_tag}" "${latest_tag}"

          if [[ "${PUBLISH}" == "true" ]]; then
            echo "Publishing frontend image to GHCR..."
            docker push "${sha_tag}"
            docker push "${latest_tag}"
          else
            echo "Skipping push (pull_request event)."
          fi

          {
            echo "sha_tag=${sha_tag}"
            echo "latest_tag=${latest_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Notify Telegram - frontend-image
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ steps.build.outputs.sha_tag }}
        run: |
          ./scripts/notify_telegram.sh "frontend-image" "${JOB_STATUS}" "${IMAGE_TAG}"

  argocd-deploy:
    runs-on: [self-hosted, macOS, minikube-local]
    needs: [changes, sonar-scan, backend-image, frontend-image]
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.sonar-scan.result == 'success' &&
      needs.backend-image.result != 'failure' &&
      needs.frontend-image.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true' ||
       needs.changes.outputs.ci == 'true')
    permissions:
      contents: read
      packages: read
    concurrency:
      group: local-minikube-deploy
      cancel-in-progress: false
    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Login to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USER}" --password-stdin

      - name: Resolve image tags to roll out
        id: images
        env:
          BACKEND_BUILT: ${{ needs.backend-image.result == 'success' }}
          FRONTEND_BUILT: ${{ needs.frontend-image.result == 'success' }}
          BACKEND_SHA_TAG: ${{ needs.backend-image.outputs.sha_tag }}
          BACKEND_LATEST_TAG: ${{ needs.backend-image.outputs.latest_tag }}
          FRONTEND_SHA_TAG: ${{ needs.frontend-image.outputs.sha_tag }}
          FRONTEND_LATEST_TAG: ${{ needs.frontend-image.outputs.latest_tag }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          if [[ "${BACKEND_BUILT}" == "true" ]]; then
            backend="${BACKEND_SHA_TAG}"
          else
            backend="${BACKEND_LATEST_TAG:-ghcr.io/${repo_lc}/backend:latest}"
          fi

          if [[ "${FRONTEND_BUILT}" == "true" ]]; then
            frontend="${FRONTEND_SHA_TAG}"
          else
            frontend="${FRONTEND_LATEST_TAG:-ghcr.io/${repo_lc}/frontend:latest}"
          fi

          echo "Deploying via Argo CD:"
          echo "  backend : ${backend}"
          echo "  frontend: ${frontend}"

          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure minikube is running
        run: |
          source scripts/lib_minikube.sh
          ensure_minikube_running "1" "docker" "4" "6144"

      - name: Pre-load images into minikube
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          source scripts/lib_minikube.sh
          load_image_into_minikube "${BACKEND_IMAGE}"
          load_image_into_minikube "${FRONTEND_IMAGE}"
          load_image_into_minikube "postgres:16-alpine"

      - name: Install / refresh Argo CD
        env:
          ENABLE_PORT_FORWARD: "1"
        run: ./scripts/install_argocd.sh

      - name: Sync FlowBoard application via Argo CD
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: ./scripts/argocd_sync.sh

      - name: Ensure observability stack is up
        env:
          ENABLE_OBSERVABILITY: "1"
          BUILD_OBSERVABILITY_LOCAL: "1"
        run: ./scripts/enable_observability_minikube.sh

      - name: Re-establish app port-forwards
        run: |
          source scripts/lib_minikube.sh
          ensure_port_forward "frontend"   "flowboard"  "frontend"      "18081" "80"   "/"
          ensure_port_forward "backend"    "flowboard"  "backend"       "18080" "8080" "/health"
          ensure_port_forward "grafana"    "monitoring" "grafana"       "13000" "80"   "/api/health"
          ensure_port_forward "prometheus" "monitoring" "prometheus"    "19090" "9090" "/-/healthy"
          ensure_port_forward "argocd"     "argocd"     "argocd-server" "18083" "80"   "/"
          ensure_port_forward "sonarqube"  "sonarqube"  "sonarqube"     "19000" "9000" "/api/system/status"
          ensure_kubectl_proxy 18001

      - name: Print URLs
        run: |
          echo "====== FlowBoard URLs (persistent after CI/CD) ======"
          echo "  Frontend     : http://127.0.0.1:18081"
          echo "  Backend API  : http://127.0.0.1:18080/health"
          echo "  Grafana      : http://127.0.0.1:13000"
          echo "  Prometheus   : http://127.0.0.1:19090"
          echo "  Argo CD UI   : http://127.0.0.1:18083"
          echo "  SonarQube    : http://127.0.0.1:19000"
          echo "  K8s Dashboard: http://127.0.0.1:18001/api/v1/namespaces/kubernetes-dashboard/services/http:kubernetes-dashboard:/proxy/"
          echo "======================================================"
          echo "Argo CD admin password:"
          kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath='{.data.password}' | base64 -d || true
          echo

      - name: Smoke test via frontend reverse proxy
        env:
          FRONTEND_URL: "http://127.0.0.1:18081"
        run: ./scripts/smoke_test_minikube.sh

      - name: Notify Telegram - argocd-deploy
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          ./scripts/notify_telegram.sh "argocd-deploy" "${JOB_STATUS}" \
            "Backend: ${BACKEND_IMAGE} | Frontend: ${FRONTEND_IMAGE}"

  observability-verify:
    runs-on: [self-hosted, macOS, minikube-local]
    needs: argocd-deploy
    if: ${{ !cancelled() && needs.argocd-deploy.result == 'success' }}
    concurrency:
      group: local-minikube-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Verify observability stack
        run: ./scripts/verify_observability_minikube.sh

      - name: Notify Telegram - observability-verify
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/notify_telegram.sh "observability-verify" "${JOB_STATUS}"

  hpa-validate:
    runs-on: [self-hosted, macOS, minikube-local]
    needs: argocd-deploy
    if: >-
      !cancelled() &&
      needs.argocd-deploy.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_hpa_validation
    concurrency:
      group: local-minikube-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Run HPA load validation
        run: ./scripts/load_test_backend_hpa.sh

      - name: Notify Telegram - hpa-validate
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: ./scripts/notify_telegram.sh "hpa-validate" "${JOB_STATUS}"

  notify-summary:
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-test
      - frontend-test
      - sonar-scan
      - backend-image
      - frontend-image
      - argocd-deploy
      - observability-verify
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Notify Telegram - pipeline summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend-test.result }}
          SONAR_RESULT: ${{ needs.sonar-scan.result }}
          BACKEND_IMG_RESULT: ${{ needs.backend-image.result }}
          FRONTEND_IMG_RESULT: ${{ needs.frontend-image.result }}
          DEPLOY_RESULT: ${{ needs.argocd-deploy.result }}
          OBS_RESULT: ${{ needs.observability-verify.result }}
        run: |
          chmod +x scripts/notify_telegram.sh
          summary="backend-test=${BACKEND_TEST_RESULT};frontend-test=${FRONTEND_TEST_RESULT};sonar-scan=${SONAR_RESULT};backend-image=${BACKEND_IMG_RESULT};frontend-image=${FRONTEND_IMG_RESULT};argocd-deploy=${DEPLOY_RESULT};observability-verify=${OBS_RESULT}"

          overall="success"
          for r in "${BACKEND_TEST_RESULT}" "${FRONTEND_TEST_RESULT}" "${SONAR_RESULT}" "${BACKEND_IMG_RESULT}" "${FRONTEND_IMG_RESULT}" "${DEPLOY_RESULT}" "${OBS_RESULT}"; do
            case "${r}" in
              failure) overall="failure" ;;
              cancelled) [[ "${overall}" != "failure" ]] && overall="cancelled" ;;
            esac
          done

          ./scripts/notify_telegram.sh "pipeline" "${overall}" "${summary}"
