name: CI/CD

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "20"
  DEPLOY_HOST: "178.253.43.153"
  DEPLOY_USER: "root"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - 'scripts/**'
            ci:
              - '.github/workflows/**'

  backend-build:
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN_BACKEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_BACKEND == 'true'

      - name: Backend build skipped
        if: env.RUN_BACKEND != 'true'
        run: echo "No backend or CI changes detected, skipping backend build."

      - uses: actions/setup-go@v5
        if: env.RUN_BACKEND == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend
        if: env.RUN_BACKEND == 'true'
        working-directory: backend
        run: go build ./...

  backend-test:
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN_BACKEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_BACKEND == 'true'

      - name: Backend tests skipped
        if: env.RUN_BACKEND != 'true'
        run: echo "No backend or CI changes detected, skipping backend tests."

      - uses: actions/setup-go@v5
        if: env.RUN_BACKEND == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Test backend
        if: env.RUN_BACKEND == 'true'
        working-directory: backend
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload backend coverage
        if: env.RUN_BACKEND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend-build:
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN_FRONTEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_FRONTEND == 'true'

      - name: Frontend build skipped
        if: env.RUN_FRONTEND != 'true'
        run: echo "No frontend or CI changes detected, skipping frontend build."

      - uses: actions/setup-node@v4
        if: env.RUN_FRONTEND == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend node_modules cache
        if: env.RUN_FRONTEND == 'true'
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        if: env.RUN_FRONTEND == 'true' && steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Build frontend
        if: env.RUN_FRONTEND == 'true'
        working-directory: frontend
        run: npm run build

  frontend-test:
    runs-on: ubuntu-latest
    needs: changes
    env:
      RUN_FRONTEND: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_FRONTEND == 'true'

      - name: Frontend tests skipped
        if: env.RUN_FRONTEND != 'true'
        run: echo "No frontend or CI changes detected, skipping frontend tests."

      - uses: actions/setup-node@v4
        if: env.RUN_FRONTEND == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend node_modules cache
        if: env.RUN_FRONTEND == 'true'
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        if: env.RUN_FRONTEND == 'true' && steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Test frontend
        if: env.RUN_FRONTEND == 'true'
        working-directory: frontend
        run: npm test

      - name: Upload frontend coverage
        if: env.RUN_FRONTEND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker-publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [changes, backend-build, backend-test, frontend-build, frontend-test]
    permissions:
      contents: read
      packages: write
    env:
      RUN_BACKEND_IMAGE: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
      RUN_FRONTEND_IMAGE: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_BACKEND_IMAGE == 'true' || env.RUN_FRONTEND_IMAGE == 'true'

      - name: Compute image names
        id: meta
        run: |
          set -euo pipefail
          repo_lc="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "repo_lc=${repo_lc}"
            echo "backend_image=ghcr.io/${repo_lc}/backend:latest"
            echo "frontend_image=ghcr.io/${repo_lc}/frontend:latest"
            echo "backend_image_sha=ghcr.io/${repo_lc}/backend:${GITHUB_SHA}"
            echo "frontend_image_sha=ghcr.io/${repo_lc}/frontend:${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker image build skipped
        if: env.RUN_BACKEND_IMAGE != 'true' && env.RUN_FRONTEND_IMAGE != 'true'
        run: echo "No backend/frontend or CI changes detected, skipping Docker image rebuild."

      - name: Login to GHCR
        if: env.RUN_BACKEND_IMAGE == 'true' || env.RUN_FRONTEND_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: env.RUN_BACKEND_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image_sha }}
            ${{ steps.meta.outputs.backend_image }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Build and push frontend image
        if: env.RUN_FRONTEND_IMAGE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image_sha }}
            ${{ steps.meta.outputs.frontend_image }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true')
    needs: [changes, docker-publish]
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_PASSWORD}" && -z "${DEPLOY_SSH_KEY}" ]]; then
            echo "Either DEPLOY_PASSWORD or DEPLOY_SSH_KEY must be configured in GitHub Secrets."
            exit 1
          fi

      - name: Install deployment dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ansible sshpass

      - name: Prepare optional SSH key
        id: key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${DEPLOY_SSH_KEY}" ]]; then
            mkdir -p "${HOME}/.ssh"
            chmod 700 "${HOME}/.ssh"
            key="${DEPLOY_SSH_KEY}"
            key="${key%\"}"
            key="${key#\"}"
            key="${key//$'\r'/}"
            printf '%s\n' "${key}" > "${HOME}/.ssh/deploy_key"
            chmod 600 "${HOME}/.ssh/deploy_key"
            ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null
            echo "use_key=true" >> "$GITHUB_OUTPUT"
            echo "key_file=${HOME}/.ssh/deploy_key" >> "$GITHUB_OUTPUT"
          else
            echo "use_key=false" >> "$GITHUB_OUTPUT"
            echo "key_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe SSH auth method
        id: auth
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          USE_KEY: ${{ steps.key.outputs.use_key }}
          KEY_FILE: ${{ steps.key.outputs.key_file }}
        run: |
          set -euo pipefail
          if [[ "${USE_KEY}" == "true" ]]; then
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -i "${KEY_FILE}" "${DEPLOY_USER}@${DEPLOY_HOST}" "echo ok" >/dev/null 2>&1; then
              echo "resolved_auth=key" >> "$GITHUB_OUTPUT"
            elif [[ -n "${DEPLOY_PASSWORD}" ]]; then
              echo "SSH key auth failed, falling back to password auth."
              echo "resolved_auth=password" >> "$GITHUB_OUTPUT"
            else
              echo "SSH key auth failed and DEPLOY_PASSWORD is empty."
              exit 1
            fi
          else
            if [[ -z "${DEPLOY_PASSWORD}" ]]; then
              echo "Neither working SSH key nor DEPLOY_PASSWORD provided."
              exit 1
            fi
            echo "resolved_auth=password" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Ansible inventory
        run: |
          set -euo pipefail
          printf '[app]\n%s ansible_user=%s\n' "${DEPLOY_HOST}" "${DEPLOY_USER}" > infra/ansible/inventory.ci.ini

      - name: Prepare Ansible vars
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          RESOLVED_AUTH: ${{ steps.auth.outputs.resolved_auth }}
          KEY_FILE: ${{ steps.key.outputs.key_file }}
          BACKEND_IMAGE: ${{ needs.docker-publish.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.docker-publish.outputs.frontend_image }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          vars_dict = {
              "ansible_user": os.environ["DEPLOY_USER"],
              "deploy_dir": "/opt/flowboard",
              "compose_file_name": "docker-compose.prod.yml",
              "backend_image": os.environ["BACKEND_IMAGE"],
              "frontend_image": os.environ["FRONTEND_IMAGE"],
              "db_user": "flowboard",
              "db_password": "flowboard",
              "db_name": "flowboard",
              "registry_url": "ghcr.io",
              "registry_username": os.environ["REGISTRY_USERNAME"],
              "registry_password": os.environ["REGISTRY_PASSWORD"],
          }

          if os.environ.get("RESOLVED_AUTH") == "key":
              vars_dict["ansible_ssh_private_key_file"] = os.environ["KEY_FILE"]
          else:
              password = os.environ["DEPLOY_PASSWORD"]
              vars_dict["ansible_password"] = password
              vars_dict["ansible_ssh_pass"] = password

          with open("/tmp/ansible-vars.json", "w", encoding="utf-8") as f:
              json.dump(vars_dict, f)
          PY

      - name: Install Docker on server
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
        run: |
          set -euo pipefail
          ansible-playbook -i infra/ansible/inventory.ci.ini infra/ansible/playbooks/install_docker.yml -e "@/tmp/ansible-vars.json"

      - name: Deploy application stack
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_CONFIG: infra/ansible/ansible.cfg
        run: |
          set -euo pipefail
          ansible-playbook -i infra/ansible/inventory.ci.ini infra/ansible/playbooks/deploy_flowboard.yml -e "@/tmp/ansible-vars.json"

      - name: Smoke test deployed app
        run: |
          set -euo pipefail
          curl -fsS -m 20 "http://${DEPLOY_HOST}/api/insights" >/dev/null
          curl -fsS -m 20 "http://${DEPLOY_HOST}:8080/api/tasks" >/dev/null
